name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Production bilan bir xil PHP versiyasi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, gd, sodium, curl
          coverage: none

      - name: Composer keshi
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Test muhiti
        # Nutgram bo'sh token bilan ishga tushmaydi; testlarda Telegram'ga so'rov yuborilmaydi (FakeNutgram).
        run: |
          cp .env.example .env
          sed -i 's/^TELEGRAM_TOKEN=.*/TELEGRAM_TOKEN=123:TEST/' .env
          php artisan key:generate

      - run: vendor/bin/phpunit

  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production
    environment: production
    steps:
      # Kalit serverda faqat /usr/local/sbin/snos-deploy ni ishga tushira oladi (forced command).
      - name: Production'ni yangilash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$HOST" ]; then
            echo "::warning::DEPLOY_SSH_KEY / DEPLOY_HOST sozlanmagan — deploy o'tkazib yuborildi"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes "root@$HOST"
